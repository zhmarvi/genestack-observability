additionalPrometheusRulesMap:
  hp-smart-array-controller-cache-status:
    groups:
    - name: hp-smart-array-controller-cache-status
      rules:
      - alert: hp-smart-array-controller-cache-status-warning
        expr: hp_smart_array_controller_cache_status{job="node-exporter"} < 1
        for: 5m
        labels:
          severity: warning
          node: "{{ $labels.k8s_node_name }}"
          group_name: hp-smart-array-controller-cache-status
          node_hostname: '{{ $labels.k8s_node_name }}'
          affected_node: '{{ $labels.k8s_node_name }}'
          correlation_key: node/{{ $labels.k8s_node_name }}
          correlation_scope: node
          root_cause: 'true'
        annotations:
          runbook_url: default_runbook_url
          dashboard_url: default_dashboard_url
          summary: "HP RAID controller cache status alert"
          description: "{{ $labels.name }}\nController cache is not OK, so the array may have dropped to write-through and lost write caching. A failed or learning capacitor is the usual cause; check hp-smart-array-controller-status for a wider controller fault.\nNode: {{ $labels.k8s_node_name }}"
      - alert: hp-smart-array-controller-cache-status-critical
        expr: hp_smart_array_controller_cache_status{job="node-exporter"} < 1
        for: 15m
        labels:
          severity: critical
          node: "{{ $labels.k8s_node_name }}"
          group_name: hp-smart-array-controller-cache-status
          node_hostname: '{{ $labels.k8s_node_name }}'
          affected_node: '{{ $labels.k8s_node_name }}'
          correlation_key: node/{{ $labels.k8s_node_name }}
          correlation_scope: node
          root_cause: 'true'
        annotations:
          runbook_url: default_runbook_url
          dashboard_url: default_dashboard_url
          summary: "HP RAID controller cache status alert"
          description: "{{ $labels.name }}\nController cache has been reporting a non-OK status for 15m. Write caching is likely disabled, which degrades write performance and removes the battery-backed write buffer.\nNode: {{ $labels.k8s_node_name }}"
